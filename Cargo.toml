[package]
name = "transcribe"
version = "0.1.0"
edition = "2021"

[dependencies]
whisper-rs = "0.8"
hound = "3"
reqwest = { version = "0.11", features = ["blocking", "json"] }
indicatif = "0.17"
dirs = "5"
crossbeam = "0.8"
ctrlc = "3"
chrono = "0.4"
cpal = "0.15"
libc = "0.2"

# FFmpeg: use feature "build" only on Unix (compiles FFmpeg from source)
# On Windows, use pre-built FFmpeg binaries via FFMPEG_DIR
[target.'cfg(unix)'.dependencies]
ffmpeg-next = { version = "6", features = ["build"] }

[target.'cfg(windows)'.dependencies]
ffmpeg-next = "6"
wasapi = "0.23"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "1.5"